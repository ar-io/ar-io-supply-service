# Deploy: copy to /etc/nginx/sites-available/ario-supply and symlink into
# sites-enabled. See README.md "Deploy" section for the full sequence —
# the TLS cert must exist (via certbot) before this config can be loaded.

server {
    listen 80;
    listen [::]:80;
    server_name ario.permaweb.services;

    # Required for certbot's HTTP-01 challenge (initial issuance + the
    # automatic renewals certbot.timer runs twice daily).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ario.permaweb.services;
    ssl_certificate     /etc/letsencrypt/live/ario.permaweb.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ario.permaweb.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # Public, read-only, unauthenticated data — safe to allow any origin.
        add_header Access-Control-Allow-Origin * always;

        proxy_pass         http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
